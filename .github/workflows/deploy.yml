# 公告发布工作流（放在**独立的公告仓库** `app-notice` 里，不是应用源码仓库）
#
# 它只做一件事：把 Repository Secret 里的 NOTICE_JSON 临时写成 public/notice.json，
# 校验通过后部署到 GitHub Pages。
#
# 三条纪律，改这个文件时别破坏它们：
# 1. **公告正文不进 Git**：仓库里没有 notice.json，它是运行时生成的，只存在于
#    Actions 的临时工作区与 Pages 的部署产物里。
# 2. **公告正文不进日志**：内容经 env 传给脚本（不用命令行参数，免得进进程列表），
#    校验脚本只打印结论与 id，不打印正文。
# 3. **只用官方 Action**：actions/configure-pages、actions/upload-pages-artifact、
#    actions/deploy-pages。不引第三方 Action，更不执行公告内容里的任何东西。
#
# 触发方式：仓库 → Actions → 左侧选「Deploy notice」→ Run workflow。
# 前置条件：Settings → Pages → Build and deployment → Source 选 **GitHub Actions**。
name: Deploy notice

on:
  # 只手动触发：公告发布是「我想发一句话」的动作，不该被 push 意外带出去
  workflow_dispatch:

# 最小权限：
#   contents: read  —— 读仓库（本工作流其实不 checkout，留着只为最小可用集）
#   pages: write    —— 写 Pages 部署
#   id-token: write —— deploy-pages 用 OIDC 换一次性令牌，不需要 PAT
permissions:
  contents: read
  pages: write
  id-token: write

# 同一条流水线不并发：两次部署互相打断会留下半成品
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 写入 notice.json（内容来自 Secret，不进 Git、不进日志）
        env:
          # Secret 经 env 传入：写在 run 的字符串里会出现在日志的「展开后命令」中
          NOTICE_JSON: ${{ secrets.NOTICE_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${NOTICE_JSON:-}" ]; then
            echo "::error::还没有配置仓库 Secret NOTICE_JSON（Settings → Secrets and variables → Actions → New repository secret）"
            exit 1
          fi
          mkdir -p public
          # 用 printf 而不是 echo：正文里的反斜杠不该被解释，末尾也不该多一个换行
          printf '%s' "$NOTICE_JSON" > public/notice.json

      - name: 校验 notice.json（格式不对就终止发布）
        run: |
          set -euo pipefail
          # 从 stdin 读脚本：这样脚本里可以随便用引号，也不必往仓库里多塞一个文件
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs'

          const fail = (msg) => {
            console.error('::error::notice.json 校验失败：' + msg)
            process.exit(1)
          }

          let raw
          try {
            raw = JSON.parse(readFileSync('public/notice.json', 'utf8'))
          } catch {
            fail('不是合法的 JSON')
          }
          if (raw === null || typeof raw !== 'object' || Array.isArray(raw)) fail('顶层必须是一个对象')
          if (typeof raw.enabled !== 'boolean') fail('enabled 必须是布尔值')
          const nonEmpty = (v) => typeof v === 'string' && v.trim().length > 0
          if (!nonEmpty(raw.id)) fail('id 必须是非空字符串')
          if (!nonEmpty(raw.title)) fail('title 必须是非空字符串')
          if (!nonEmpty(raw.content)) fail('content 必须是非空字符串')
          if (raw.publishedAt !== undefined && typeof raw.publishedAt !== 'string') fail('publishedAt 必须是字符串')
          if (raw.minVersion !== undefined && typeof raw.minVersion !== 'string') fail('minVersion 必须是字符串')

          // 只打印结论与 id —— **不打印正文**
          console.log('notice.json 校验通过（id=' + raw.id + ', enabled=' + raw.enabled + '）')
          NODE

      - name: 配置 Pages
        # 三个 Action 的版本都取当前官方推荐值（各自最新主版本），运行时是 node24。
        # 不要沿用过时的 v5/v3/v4：那几版跑在 node20 上，GitHub 已开始弃用，
        # 每次运行都会打一条 deprecation 警告（2026-10 实测）。
        uses: actions/configure-pages@v6

      - name: 打包静态文件
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
          # 部署产物里带着公告正文，保留期压到最短（v5 默认就是 1 天，这里写明确）
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: 输出公告地址
        run: echo "公告地址（填进客户端的 src/lib/noticeConfig.ts）：${{ steps.deployment.outputs.page_url }}notice.json"
